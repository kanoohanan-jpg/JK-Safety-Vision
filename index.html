<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Safety Vision | Security Store</title>
<meta name="description" content="Shop CCTV cameras, DVR, NVR, networking and security products at JK Safety Vision.">

<style>
:root{
  --bg:#fff8f6;
  --white:#fffdfc;
  --ink:#44383a;
  --muted:#88777a;
  --line:#f0dfe0;
  --gold:#c99a83;
  --gold-dark:#a87568;
  --dark:#6d5154;
  --soft:#f8e9e5;
  --sale:#b96b68;
  --shadow:0 12px 30px rgba(109,81,84,.09);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.container{width:min(1280px,calc(100% - 34px));margin:auto}

/* TOP STRIP */
.top-strip{
  background:#f3dfdc;
  color:#765b5c;
  padding:9px 0;
  font-size:11px;
  letter-spacing:.35px;
}
.top-strip-inner{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.top-strip span{opacity:.95}

/* HEADER */
.store-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,253,252,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.header-main{
  min-height:82px;
  display:grid;
  grid-template-columns:225px minmax(200px,1fr) auto;
  align-items:center;
  gap:25px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:45px;height:45px;flex:0 0 45px;
  display:grid;place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#d7ad9e,#a87568);
  color:white;font-weight:900;font-size:18px;
}
.brand-name{font-size:16px;font-weight:900;line-height:1.1;letter-spacing:.3px}
.brand-sub{
  display:block;margin-top:5px;color:var(--muted);
  font-size:9px;font-weight:700;letter-spacing:1.5px;
}
.search-wrap{
  display:flex;min-width:0;height:46px;
  border:1px solid var(--line);border-radius:13px;
  background:#fff8f6;overflow:hidden;
}
.search-wrap:focus-within{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,154,131,.14);
}
.search-wrap input{
  width:100%;min-width:0;padding:0 15px;
  border:0;outline:0;background:transparent;
  color:var(--ink);font-size:13px;
}
.search-wrap button{
  width:54px;flex:0 0 54px;border:0;
  background:var(--gold);color:white;font-size:19px;
}
.header-actions{display:flex;align-items:center;gap:18px}
.header-action{
  position:relative;display:flex;align-items:center;gap:7px;
  border:0;background:transparent;color:var(--ink);
  font-size:12px;font-weight:700;white-space:nowrap;
}
.action-icon{font-size:21px}
.cart-count{
  position:absolute;top:-9px;left:13px;min-width:17px;height:17px;
  display:grid;place-items:center;padding:0 4px;
  border-radius:50px;background:var(--sale);color:white;font-size:10px;
}

/* NAVIGATION */
.category-nav{background:#fffdfc;border-top:1px solid #f5e9e7}
.category-nav-inner{
  display:flex;justify-content:space-between;gap:12px;
  overflow-x:auto;scrollbar-width:none;padding:13px 0;
}
.category-nav-inner::-webkit-scrollbar{display:none}
.category-nav a{
  flex:0 0 auto;color:#66575a;font-size:12px;font-weight:700;
  transition:color .2s;
}
.category-nav a:hover{color:var(--gold-dark)}
.brand-bar{background:#fffaf8;border-bottom:1px solid var(--line)}
.brand-bar-inner{
  display:flex;align-items:center;gap:14px;
  padding:11px 0;overflow-x:auto;scrollbar-width:none;
}
.brand-bar-inner::-webkit-scrollbar{display:none}
.brand-bar-label{
  flex:0 0 auto;color:var(--gold-dark);
  font-size:10px;font-weight:900;letter-spacing:1.6px;
}
#brandPills{display:flex;gap:8px;flex:0 0 auto}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:45px;padding:0 19px;border:1px solid var(--gold);
  border-radius:11px;background:var(--gold);color:white;
  font-size:12px;font-weight:800;transition:.2s;
}
.btn:hover{
  background:var(--gold-dark);border-color:var(--gold-dark);
  transform:translateY(-2px);
}
.btn-outline{border-color:#d8b8ad;background:transparent;color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.15);border-color:white}

/* CATEGORY STRIP */
.cat-strip{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:16px auto 0;padding:14px 10px;
  background:#fffdfc;border:1px solid var(--line);border-radius:17px;
  box-shadow:0 5px 18px rgba(109,81,84,.035);
}
.cat-strip::-webkit-scrollbar{display:none}
.cat-item{
  flex:1 0 92px;display:flex;flex-direction:column;
  align-items:center;gap:7px;padding:4px;
  background:none;border:0;color:var(--ink);
  font-size:11px;font-weight:700;text-align:center;
}
.cat-circle{
  width:68px;height:68px;display:grid;place-items:center;
  border-radius:50%;background:#f9ece9;border:1px solid #f0dfe0;
  overflow:hidden;transition:.2s;
}
.cat-item:hover .cat-circle{
  border-color:var(--gold);transform:translateY(-3px);box-shadow:var(--shadow);
}
.cat-item img{width:82%;height:82%;object-fit:contain}

/* HERO */
.hero{
  display:grid;grid-template-columns:1.3fr .7fr;
  min-height:365px;margin:24px auto;overflow:hidden;
  border:1px solid #efd9d5;border-radius:24px;
  background:
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.75),transparent 32%),
    linear-gradient(115deg,#f4dfdc 0%,#f9ece7 55%,#ead0c6 100%);
  color:var(--ink);box-shadow:var(--shadow);
}
.hero-copy{
  display:flex;flex-direction:column;justify-content:center;
  align-items:flex-start;padding:48px clamp(24px,5vw,65px);
}
.hero-tag{
  padding:8px 12px;border:1px solid #d9b5a8;border-radius:999px;
  color:#956b60;font-size:10px;font-weight:800;
  letter-spacing:1.6px;text-transform:uppercase;
}
.hero h1{
  max-width:650px;margin:19px 0 13px;
  font-size:clamp(35px,5vw,60px);line-height:1.02;letter-spacing:-2px;
  color:#4b393c;
}
.hero p{
  max-width:510px;margin:0 0 25px;color:#79666a;
  font-size:14px;line-height:1.7;
}
.hero-buttons{display:flex;flex-wrap:wrap;gap:11px}
.hero-visual{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-width:0;padding:20px;
  background:radial-gradient(circle at 55% 50%,rgba(255,255,255,.7),transparent 62%);
}
.hero-visual img{
  width:100%;
  height:420px;
  max-height:none;
  object-fit:contain;
  object-position:center;
  display:block;
  filter:drop-shadow(0 22px 16px rgba(80,54,52,.18));
}
.hero-bubble{
  position:absolute;right:9%;bottom:15%;padding:12px 16px;
  border:1px solid rgba(255,255,255,.8);border-radius:12px;
  background:rgba(255,253,252,.8);backdrop-filter:blur(10px);
  color:#72575a;font-size:11px;font-weight:700;
}
.hero-dots{display:flex;gap:7px;margin-top:22px}
.hero-dots button{
  width:9px;height:9px;padding:0;border:0;border-radius:9px;
  background:#d8b9b0;transition:.3s;
}
.hero-dots button.active{width:26px;background:var(--gold-dark)}

/* BENEFITS */
.benefits{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin:0 auto 34px;
}
.benefit{
  display:flex;align-items:center;gap:12px;padding:17px;
  border:1px solid var(--line);border-radius:15px;
  background:#fffdfc;box-shadow:0 4px 15px rgba(109,81,84,.025);
}
.benefit-icon{
  width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;
  border-radius:12px;background:#f8e9e5;font-size:19px;
}
.benefit strong{display:block;font-size:12px}
.benefit small{display:block;margin-top:4px;color:var(--muted);font-size:10px}

/* SECTIONS */
.section{margin:38px auto}
.section-head{
  display:flex;justify-content:space-between;align-items:end;
  gap:15px;margin-bottom:17px;
}
.section-kicker{
  display:block;margin-bottom:7px;color:var(--gold-dark);
  font-size:10px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;
}
.section-head h2{margin:0;font-size:clamp(23px,3vw,31px);letter-spacing:-.8px}
.section-head p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.text-link{flex:0 0 auto;color:var(--gold-dark);font-size:12px;font-weight:800}

/* CATEGORY CARDS */
.category-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.category-tile{
  display:flex;flex-direction:column;align-items:center;
  padding:17px 10px 15px;border:1px solid var(--line);
  border-radius:16px;background:#fffdfc;text-align:center;transition:.2s;
}
.category-tile:hover{
  transform:translateY(-4px);border-color:#d8b5a8;box-shadow:var(--shadow);
}
.category-art{
  width:100%;height:105px;display:grid;place-items:center;
  margin-bottom:10px;border-radius:12px;background:#f9eeeb;
}
.category-art img{width:90%;height:90%;object-fit:contain}
.category-tile strong{font-size:12px}
.category-tile small{margin-top:5px;color:var(--muted);font-size:10px}

/* PRODUCT ROWS */
.row-box{
  padding:20px 20px 8px;background:#fffdfc;
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 5px 18px rgba(109,81,84,.035);
}
.h-row{
  display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x proximity;
  padding:3px 2px 12px;scrollbar-width:thin;
}
.h-row .product-card{flex:0 0 205px;scroll-snap-align:start}

/* PRODUCTS */
.product-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:15px;
}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  padding:8px 13px;border:1px solid var(--line);border-radius:999px;
  background:#fffdfc;color:var(--muted);font-size:11px;font-weight:700;
}
.filter-btn.active,.filter-btn:hover{
  background:var(--dark);border-color:var(--dark);color:white;
}
.sort-group{display:flex;gap:8px;flex-wrap:wrap}
.sort-select{
  min-height:36px;padding:0 10px;border:1px solid var(--line);
  border-radius:10px;background:#fffdfc;color:var(--ink);font-size:11px;
}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.product-card{
  position:relative;min-width:0;padding:12px;
  border:1px solid var(--line);border-radius:16px;
  background:#fffdfc;transition:.2s;
}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.product-image{
  position:relative;display:grid;place-items:center;height:175px;
  margin-bottom:12px;border-radius:12px;background:#f9eeeb;overflow:hidden;
}
.product-image img{width:100%;height:100%;padding:8px;object-fit:contain}
.discount-badge{
  position:absolute;top:9px;left:9px;padding:5px 7px;
  border-radius:6px;background:var(--sale);color:white;
  font-size:9px;font-weight:800;
}
.wish-btn{
  position:absolute;top:7px;right:8px;width:29px;height:29px;
  border:0;border-radius:50%;background:rgba(255,255,255,.92);
  color:#706b62;font-size:17px;
}
.wish-btn.active{color:var(--sale)}
.product-brand{
  color:var(--gold-dark);font-size:9px;font-weight:900;
  letter-spacing:1px;text-transform:uppercase;
}
.product-card h3{min-height:37px;margin:7px 0 5px;font-size:13px;line-height:1.4}
.rating{margin-bottom:9px;color:#9b784a;font-size:10px}
.rating span{color:var(--muted)}
.rating-badge{
  display:inline-flex;align-items:center;padding:2px 7px;
  border-radius:5px;background:var(--gold-dark);color:white;
  font-size:10px;font-weight:800;margin-right:5px;
}
.price-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.current-price{font-size:16px;font-weight:900}
.old-price{color:#99948b;font-size:10px;text-decoration:line-through}
.product-note{margin-top:5px;color:var(--muted);font-size:9px}
.product-actions{display:flex;gap:7px;margin-top:12px}
.add-cart{
  flex:1;min-height:36px;border:1px solid var(--dark);
  border-radius:9px;background:var(--dark);color:white;
  font-size:10px;font-weight:800;
}
.add-cart:hover{background:var(--gold-dark);border-color:var(--gold-dark)}
.quick-order{
  width:38px;border:1px solid var(--line);border-radius:9px;
  background:#fff8f6;color:var(--ink);font-size:15px;
}
.quick-order:hover{border-color:var(--gold)}
.no-products{
  grid-column:1/-1;padding:35px;text-align:center;color:var(--muted);
  background:#fffdfc;border:1px dashed var(--line);border-radius:14px;
}

/* PROMO */
.promo{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;
  margin:38px auto;padding:28px 34px;border-radius:20px;
  background:linear-gradient(110deg,#f8e9e5,#f2ded8);
  border:1px solid #ecd4ce;
}
.promo h2{margin:0 0 7px;font-size:clamp(21px,3vw,29px)}
.promo p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.promo .btn{white-space:nowrap}

/* BRANDS + INFO */
.brand-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.brand-tile{
  display:grid;place-items:center;min-height:78px;padding:12px;
  border:1px solid var(--line);border-radius:13px;background:#fffdfc;
  color:#66575a;font-size:15px;font-weight:900;letter-spacing:.5px;
  cursor:pointer;transition:.2s;
}
.brand-tile:hover{border-color:#d8b5a8;box-shadow:var(--shadow);transform:translateY(-3px)}
.store-info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:38px auto}
.info-card{
  padding:21px;border:1px solid var(--line);border-radius:16px;
  background:#fffdfc;
}
.info-card .info-icon{font-size:23px}
.info-card h3{margin:11px 0 7px;font-size:14px}
.info-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}

/* FOOTER */
.footer{
  margin-top:45px;padding:42px 0 18px;
  background:#6d5154;color:#fff8f5;
}
.footer-grid{
  display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:30px;padding-bottom:30px;
}
.footer h3{margin:0 0 14px;font-size:13px}
.footer p,.footer a{color:#f0deda;font-size:11px;line-height:1.8}
.footer a{display:block;margin:5px 0}
.footer a:hover{color:#fff}
.footer-brand{color:#f6d9cf;font-size:18px;font-weight:900}
.footer-bottom{
  padding-top:17px;border-top:1px solid rgba(255,255,255,.2);
  color:#e5ceca;font-size:10px;text-align:center;
}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:200;
  max-width:calc(100% - 36px);padding:13px 17px;border-radius:11px;
  background:var(--dark);color:white;font-size:12px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateY(12px);transition:.25s;
}
.toast.show{opacity:1;transform:translateY(0)}
/* CONTACT POPUP */
.contact-overlay{
  position:fixed;inset:0;z-index:500;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(55,39,42,.55);backdrop-filter:blur(5px);
}
.contact-overlay.show{display:flex}
.contact-popup{
  position:relative;width:min(420px,100%);padding:30px 24px;
  border:1px solid var(--line);border-radius:20px;
  background:var(--white);box-shadow:0 20px 60px rgba(0,0,0,.2);
  text-align:center;
}
.contact-popup h2{margin:0 0 8px;color:var(--ink);font-size:23px}
.contact-popup p{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}
.contact-popup .contact-name{
  margin-bottom:20px;color:var(--gold-dark);font-size:13px;font-weight:800;
}
.contact-popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact-popup-actions a{
  display:flex;align-items:center;justify-content:center;min-height:46px;
  padding:10px;border-radius:10px;color:white;font-size:12px;font-weight:800;
}
.contact-call{background:var(--dark)}
.contact-whatsapp{background:#218b57}
.contact-close{
  position:absolute;top:10px;right:12px;width:32px;height:32px;
  border:0;border-radius:50%;background:var(--soft);color:var(--ink);font-size:20px;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .header-main{grid-template-columns:190px 1fr auto;gap:13px}
  .header-action span:not(.action-icon):not(.cart-count){display:none}
  .category-grid{grid-template-columns:repeat(3,1fr)}
  .benefits{grid-template-columns:repeat(2,1fr)}
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
  .container{width:calc(100% - 22px)}
  .top-strip-inner{justify-content:center;text-align:center}
  .header-main{grid-template-columns:1fr auto;gap:10px;padding:11px 0}
  .brand-mark{width:39px;height:39px;flex-basis:39px}
  .brand-name{font-size:13px}
  .header-actions{gap:12px}
  .header-action{padding:5px}
  .action-icon{font-size:20px}
  .search-wrap{grid-column:1/-1;grid-row:2;height:42px}
  .category-nav-inner{justify-content:flex-start;gap:20px}
  .hero{grid-template-columns:1fr;margin:14px auto 20px}
  .hero-copy{padding:29px 23px 10px}
  .hero h1{font-size:39px}
  .hero-visual{min-height:185px}
  .hero-visual img{max-height:190px;width:75%}
  .hero-bubble{bottom:9%;right:5%}
  .benefits{gap:8px;margin-bottom:25px}
  .benefit{padding:11px 9px;gap:8px}
  .benefit-icon{width:32px;height:32px;flex-basis:32px;font-size:16px}
  .benefit strong{font-size:10px}
  .benefit small{font-size:9px}
  .section{margin:29px auto}
  .category-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .category-tile{padding:10px 6px}
  .category-art{height:80px}
  .category-tile strong{font-size:10px}
  .category-tile small{font-size:9px}
  .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .product-card{padding:8px}
  .product-image{height:130px}
  .product-card h3{font-size:11px}
  .current-price{font-size:14px}
  .product-toolbar{align-items:flex-start;flex-direction:column}
  .h-row .product-card{flex-basis:158px}
  .row-box{padding:14px 12px 4px}
  .cat-item{flex-basis:78px;font-size:10px}
  .cat-circle{width:58px;height:58px}
  .sort-group{width:100%}
  .sort-group .sort-select{flex:1;min-width:0}
  .promo{grid-template-columns:1fr;padding:22px}
  .promo .btn{justify-self:start}
  .brand-grid{grid-template-columns:repeat(2,1fr)}
  .store-info{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr;gap:23px}
}
@media(max-width:380px){
  .contact-popup-actions{grid-template-columns:1fr}
}
@media(max-width:360px){
  .product-image{height:110px}
  .product-actions{flex-direction:column}
  .quick-order{width:100%;min-height:32px}
}

/* =========================================
   FLIPKART-INSPIRED WHITE + BLUE + YELLOW THEME
   Colour override only — layout/features unchanged
========================================= */

:root{
  --bg:#f1f3f6;
  --white:#ffffff;
  --ink:#212121;
  --muted:#70757d;
  --line:#e0e0e0;
  --gold:#2874f0;
  --gold-dark:#1d5dbf;
  --dark:#2874f0;
  --soft:#fff3a6;
  --sale:#f5c518;
  --shadow:0 8px 24px rgba(40,116,240,.09);
  --radius:18px;
}

/* Page and top strip */
body{background:var(--bg);color:var(--ink)}
.top-strip{background:#172337;color:#fff}
.store-header{background:rgba(255,255,255,.97)}
.category-nav{background:#fff;border-color:#e5e7eb}
.category-nav a{color:#333}
.category-nav a:hover{color:#2874f0}
.brand-bar{background:#eaf2ff;border-color:#d7e5ff}
.brand-bar-label{color:#1d5dbf}

/* Logo and search */
.brand-mark{
  background:linear-gradient(135deg,#2874f0,#174ea6);
  color:#ffe500;
}
.brand-sub{color:#70757d}
.search-wrap{background:#fff;border-color:#d9e2f2}
.search-wrap:focus-within{
  border-color:#2874f0;
  box-shadow:0 0 0 3px rgba(40,116,240,.13);
}
